name: test

# Everything here is quick: the shell-level half of ./test.sh, plus the
# linters. The flake evaluations and the actual system builds are slow enough
# to live in update.yml instead.

# workflow_dispatch lets update.yml start this on its own PR branch. There is
# no pull_request trigger: PRs here come from this repo's own branches, whose
# pushes already run it, and a bot PR's run would wait for approval.
on: [push, workflow_dispatch]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Darwin on purpose. This repo never runs anywhere else, and the tests
    # exercise scripts that assume a Mac.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # nix develop supplies shellcheck and actionlint at the
      # versions flake.lock pins, so nothing in tests/ has to skip.
      - name: ./test.sh --fast
        run: nix develop --command ./test.sh --fast
