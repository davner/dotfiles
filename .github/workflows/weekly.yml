name: weekly

# The expensive half: evaluating both configurations and then building their
# whole system closures from a cold store. This is what catches a package that
# vanished from nixpkgs or an option that changed meaning under a locked input,
# neither of which the push tests can see.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC, 07:00 in Arizona
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # magic-nix-cache authenticates with an OIDC token

jobs:
  full:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          # test.sh renders the changelog template, which needs the history.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@main

      # Both configurations' closures are built from a cold store below, which
      # is most of the 90 minutes. The cache is backed by the GitHub Actions
      # cache and its 10GB per-repo limit, which two darwin closures may not
      # fit inside; if the hit rate turns out to be near zero, drop this.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: ./test.sh
        run: nix develop --command ./test.sh

      - name: nix flake check
        run: nix flake check --print-build-logs

      # Only builds. Activation is what needs a real Mac with these users on
      # it, and no CI runner has that.
      - name: Build every configuration
        run: |
          set -euo pipefail
          for user in $(./users.sh list); do
            attr="${user//./-}"
            echo "::group::darwinConfigurations.$attr.system"
            nix build --no-link --print-build-logs ".#darwinConfigurations.$attr.system"
            echo "::endgroup::"
          done
