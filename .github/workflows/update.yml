name: update

# The weekly expensive half: bump the flake inputs, then run the full suite,
# nix flake check and a cold build of the whole system closure. The build is
# what catches a package that vanished from nixpkgs or an option that changed
# meaning, which the push tests cannot see. When the lock moved, the checks run
# on the one flake-update PR branch and only a green run arms it to
# squash-merge itself; when nothing moved, they run on the current lock.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC, 07:00 in Arizona
  workflow_dispatch:

# Two runs at once would race for the one flake-update branch.
concurrency:
  group: update
  cancel-in-progress: false

# The last four are what update-flake-lock's README asks for.
permissions:
  actions: write # starts test.yml on the PR branch
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  flake-update:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: nix flake update
        id: update
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          branch: flake-update
          commit-msg: "chore(deps): nix flake update"
          pr-title: "chore(deps): nix flake update"
          pr-labels: dependencies
          pr-body: |
            Weekly flake input bump. The update workflow runs `./test.sh`, `nix flake check` and the build on this branch, and arms auto-merge only when they pass.

      - name: Check out the PR branch
        if: steps.update.outputs.pull-request-operation == 'created' || steps.update.outputs.pull-request-operation == 'updated'
        run: |
          git fetch origin flake-update
          git switch --discard-changes --detach FETCH_HEAD

      # A pull request opened with GITHUB_TOKEN does not trigger test.yml, so
      # the checks that would have run on it run here instead.
      - name: ./test.sh
        run: nix develop --command ./test.sh

      - name: nix flake check
        run: nix flake check --print-build-logs

      # Only builds. Activation needs a real Mac with this user on it.
      - name: Build the configuration
        run: nix build --no-link --print-build-logs .#darwinConfigurations.danavner.system

      # A push with GITHUB_TOKEN starts no workflow, so the required test check is started by hand.
      - name: Start test.yml and arm auto-merge
        if: steps.update.outputs.pull-request-operation == 'created' || steps.update.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
        run: |
          gh workflow run test.yml --ref flake-update
          gh pr merge "$PR" --auto --squash
