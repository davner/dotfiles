name: update

# The weekly expensive half: bump the flake inputs, then run the full suite,
# nix flake check and a cold build of the whole system closure. The build is
# what catches a package that vanished from nixpkgs or an option that changed
# meaning, which the push tests cannot see. When nothing moved, the same checks
# run on the current lock. Only when the lock moved does it replace the one
# flake-update branch from main and arm its PR to squash-merge itself.
on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC, 07:00 in Arizona
  workflow_dispatch:

# Two runs at once would race for the one flake-update branch.
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  actions: write # starts test.yml on the PR branch
  contents: write
  pull-requests: write
  id-token: write # magic-nix-cache authenticates with an OIDC token

jobs:
  flake-update:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      # The cache is backed by the GitHub Actions cache and its 10GB per-repo
      # limit, which a darwin closure may not fit inside; if the hit rate turns
      # out to be near zero, drop this.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Read before the long checks, so a hand fix pushed during them is not overwritten.
      - name: Where flake-update stands
        id: lease
        run: echo "lease=$(git ls-remote origin refs/heads/flake-update | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: nix flake update
        run: nix flake update

      - name: Did anything move?
        id: moved
        run: |
          if git diff --quiet flake.lock; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "Inputs are already current."
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request opened with GITHUB_TOKEN does not trigger test.yml, so
      # the checks that would have run on it run here instead.
      - name: ./test.sh
        run: nix develop --command ./test.sh

      - name: nix flake check
        run: nix flake check --print-build-logs

      # Only builds. Activation needs a real Mac with this user on it.
      - name: Build the configuration
        run: nix build --no-link --print-build-logs .#darwinConfigurations.danavner.system

      - name: Push and refresh the pull request
        if: steps.moved.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/flake-update-pr.sh flake-update "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "${{ steps.lease.outputs.lease }}"
