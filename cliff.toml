# How CHANGELOG.md gets built out of the commit history. The commits are already
# Conventional Commits, so nothing here needs maintaining by hand.
#   nix develop --command git-cliff -o CHANGELOG.md

[changelog]
header = """
# Changelog

Every change to this repo, newest first, from the commit history.

<!-- Generated by git-cliff. Do not edit by hand: run
     `nix develop --command git-cliff -o CHANGELOG.md` instead. -->

"""

body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/davner/dotfiles/commit/{{ commit.id }}), \
{{ commit.committer.timestamp | date(format="%Y-%m-%d") }})
{% endfor %}\
{% endfor %}
"""

trim = true

# The numeric prefixes only exist to order the sections; strip them back out.
postprocessors = [{ pattern = '<!-- \d+ -->', replace = "" }]

[git]
conventional_commits = true
# A commit that predates the convention still belongs in the history.
filter_unconventional = false
filter_commits = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^chore|^build", group = "<!-- 7 -->Chores" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
