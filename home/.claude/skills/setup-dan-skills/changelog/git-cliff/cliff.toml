# How CHANGELOG.md gets built out of the commit history. The changelog
# workflow regenerates it on every push to __DEFAULT_BRANCH__; locally:
#   git-cliff -o CHANGELOG.md

[changelog]
header = """
# Changelog

Every change, newest first, grouped by the day it landed and then by kind.

<!-- Generated by git-cliff. Do not edit by hand. -->
"""

# The template context has no date field, only committer.timestamp, so the
# days are collected first and each day's commits regrouped by type inside it.
# Merge commits carry no change of their own, and an unconventional "Merge pull
# request #N" subject would inline its whole message into the entry.
# The group names start with a hidden sort key, because group_by orders
# groups by name.
body = """
{% set kept = commits | filter(attribute="merge_commit", value=false) %}\
{% set_global days = [] %}\
{% for commit in kept %}\
{% set_global days = days | concat(with=commit.committer.timestamp | date(format="%Y-%m-%d")) %}\
{% endfor %}\
{% for day in days | unique | sort | reverse %}
## {{ day }}
{% for group, group_commits in kept | group_by(attribute="group") %}\
{% set_global on_day = [] %}\
{% for commit in group_commits %}\
{% if commit.committer.timestamp | date(format="%Y-%m-%d") == day %}\
{% set_global on_day = on_day | concat(with=commit) %}\
{% endif %}\
{% endfor %}\
{% if on_day | length > 0 %}
### {{ group | striptags | trim }}

{% for commit in on_day %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/__GITHUB_REPO__/commit/{{ commit.id }}))
{% endfor %}\
{% endif %}\
{% endfor %}\
{% endfor %}
"""

trim = true

[git]
conventional_commits = true
# A commit that predates the convention still belongs in the history.
filter_unconventional = false
sort_commits = "newest"

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  # The changelog workflow commits on every push; its own commits describe
  # nothing a reader wants.
  { message = "^docs: regenerate the changelog$", skip = true },
  { message = "^docs", group = "<!-- 4 -->Docs" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^chore|^build", group = "<!-- 7 -->Chore" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
