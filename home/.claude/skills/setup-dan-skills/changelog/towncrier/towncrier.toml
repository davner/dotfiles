[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/__GITHUB_REPO__/issues/{issue})"

# The order here is the order sections appear in a release.
[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feat"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "perf"
name = "Performance"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Docs"
showcontent = true

[[tool.towncrier.type]]
directory = "chore"
name = "Chore"
showcontent = true
