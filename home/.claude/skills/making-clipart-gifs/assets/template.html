<title>Clip-art GIF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap">
<style>
/* One stage, controls beneath: the animation is the only star */
:root {
  --bg: #f3f4f1;
  --fg: #1c1d1a;
  --muted: #61645c;
  --panel: #ffffff;
  --line: #d8dbd2;
  --accent: #3f6fd8;
  --accent-ink: #ffffff;
  --body: "Lexend", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151614; --fg: #eef0ea; --muted: #a2a69b; --panel: #1f211d;
    --line: #33362f; --accent: #8fb0ff; --accent-ink: #0f1220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151614; --fg: #eef0ea; --muted: #a2a69b; --panel: #1f211d;
  --line: #33362f; --accent: #8fb0ff; --accent-ink: #0f1220; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 48px;
}
main { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
h1 { font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); line-height: 1.55; max-width: 60ch; }
.stage { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; place-items: center; aspect-ratio: 1 / 1; max-width: 100%; }
.stage canvas { width: 100%; height: auto; aspect-ratio: 1 / 1; display: block; image-rendering: pixelated; }
.stage[data-bg="white"] { background: #ffffff; }
.stage[data-bg="dark"] { background: #050507; }
.stage[data-bg="clear"] {
  background-color: #ffffff;
  background-image: conic-gradient(#e3e3e3 25%, transparent 0 50%, #e3e3e3 0 75%, transparent 0);
  background-size: 20px 20px;
}
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
.group { display: flex; gap: 6px; align-items: center; }
.label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
button { font: 600 0.88rem var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.frame { font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); min-width: 5.5em; }
.error { color: var(--fg); background: var(--panel); border-radius: 8px; padding: 12px 16px; font-size: 0.9rem; text-align: center; max-width: 30ch; }
</style>

<main>
  <h1>Clip-art GIF</h1>
  <p class="lede">A gold star hops, hangs at the top, and lands with a squash.</p>
  <div class="stage" id="stage" data-bg="white" role="img" aria-label="Shiny gold star hopping over its shadow">
    <canvas id="c" width="200" height="200"></canvas>
  </div>
  <div class="controls">
    <div class="group">
      <button id="play" aria-pressed="true">Pause</button>
      <button id="prev" aria-label="Previous frame">&#8249;</button>
      <button id="next" aria-label="Next frame">&#8250;</button>
      <span class="frame" id="frame">frame 1</span>
    </div>
    <div class="group" role="group" aria-label="Background">
      <span class="label">Background</span>
      <button data-bg="white" aria-pressed="true">White</button>
      <button data-bg="dark" aria-pressed="false">Dark</button>
      <button data-bg="clear" aria-pressed="false">Clear</button>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const FRAME_MS = 150;
  // Add the site's own background here; each background gets its own render and shadow tone.
  const BG = { white: 0xffffff, dark: 0x050507 };
  const SHADOW = { white: 0xb0b0b0, dark: 0x1c1c22, clear: 0x8a8a8a };
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const query = new URLSearchParams(location.search);
  const exporting = query.has('frame');

  if (!window.THREE) {
    stage.innerHTML = '<p class="error">The 3D library did not load. Check your connection and reload the page.</p>';
    return;
  }

  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  // Render 4x large and shrink: the shrink is what gives old clip art its soft edges.
  const PX = exporting ? Number(query.get('px')) || 800 : 800;
  const glCanvas = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(PX, PX, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.BasicShadowMap;
  const view = canvas.getContext('2d');
  view.imageSmoothingQuality = 'high';

  // Seeded so textures are identical in every frame and every render.
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const skinTexture = ({ base, band, stripe, dots, grain = 0.22 }, repeat = [1, 1], offset = [0, 0]) => {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = base;
    g.fillRect(0, 0, 256, 128);
    if (band) {
      g.fillStyle = band;
      for (let x = 6; x < 256; x += 32) g.fillRect(x + rand() * 6, 0, 12 + rand() * 6, 64);
    }
    if (stripe) {
      g.fillStyle = stripe;
      g.beginPath();
      for (let x = 0; x <= 256; x += 8) g.lineTo(x, 66 + 3 * Math.sin(x / 11));
      for (let x = 256; x >= 0; x -= 8) g.lineTo(x, 76 + 3 * Math.sin(x / 11));
      g.fill();
    }
    for (let i = 0; i < 2200; i++) {
      g.fillStyle = rand() < 0.55 ? `rgba(0,0,0,${grain})` : (dots || 'rgba(255,255,255,0.25)');
      g.fillRect(rand() * 256, rand() * 128, 2, 2);
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(...repeat);
    t.offset.set(...offset);
    return t;
  };

  const phong = (color, shininess, specular, extra) => new THREE.MeshPhongMaterial(Object.assign({ color, shininess, specular }, extra));
  const add = (geom, mat, parent) => { const o = new THREE.Mesh(geom, mat); o.castShadow = true; parent.add(o); return o; };
  const sphere = (r, mat, parent, seg = 16) => add(new THREE.SphereGeometry(r, seg, Math.round(seg * 0.7)), mat, parent);
  const UNIT_CYL = new THREE.CylinderGeometry(1, 1, 1, 10);
  const rod = (r, mat, parent) => { const o = add(UNIT_CYL, mat, parent); o.userData.r = r; return o; };
  const place = (o, a, b) => {
    const d = b.clone().sub(a), len = d.length();
    o.position.copy(a).addScaledVector(d, 0.5);
    o.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
    o.scale.set(o.userData.r, len, o.userData.r);
  };
  // Two-bone IK: the joint sits off the line between the ends, on the side the hint points to.
  const joint = (A, B, L, hint) => {
    const d = Math.min(A.distanceTo(B), 2 * L - 0.001);
    const dir = B.clone().sub(A).normalize();
    const side = hint.clone().addScaledVector(dir, -hint.dot(dir)).normalize();
    return A.clone().addScaledVector(dir, d / 2).addScaledVector(side, Math.sqrt(L * L - (d / 2) ** 2));
  };
  // A side outline given depth: flat flanks and a sharp ridge, where a stretched sphere reads as an egg.
  const slab = (pts, depth, bevel, mat, parent) => {
    const shape = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x, y)));
    const geom = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 3, curveSegments: 4 });
    geom.translate(0, 0, -depth / 2);
    return add(geom, mat, parent);
  };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
  camera.position.set(0.85, 1.05, 3.22);
  camera.lookAt(0, 0.72, 0);
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  const key = new THREE.DirectionalLight(0xffffff, 0.8);
  key.position.set(-1.6, 6, 3);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);
  key.shadow.bias = -0.002;
  Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 1, far: 15 });
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9be7ff, 0.4);
  rim.position.set(1, 2, -4);
  scene.add(rim);
  // A fully opaque shadow color matches the solid gray shadow old clip art baked into the GIF.
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ color: SHADOW.white, opacity: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const buildScene = () => {
    const shape = new THREE.Shape();
    for (let k = 0; k < 10; k++) {
      const r = k % 2 ? 0.2 : 0.46, a = Math.PI / 2 + k * Math.PI / 5;
      k ? shape.lineTo(r * Math.cos(a), r * Math.sin(a)) : shape.moveTo(r * Math.cos(a), r * Math.sin(a));
    }
    const geom = new THREE.ExtrudeGeometry(shape, { depth: 0.12, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 2 });
    geom.center();
    const star = add(geom, phong(0xd9a520, 40, 0x665522), scene);
    const eyeMat = phong(0x111111, 30, 0x444444);
    for (const x of [-0.09, 0.09]) sphere(0.045, eyeMat, star, 10).position.set(x, 0.06, 0.12);
    return { star };
  };
  const parts = buildScene();

  // One row per frame: height, squash, and for a held frame its total time in ms.
  const BEATS = [
    [0.46, 1.0, 900], [0.44, 0.82], [0.62, 1.12], [0.95, 1.06], [1.12, 1.0, 750],
    [1.06, 1.0], [0.8, 1.06], [0.5, 1.1], [0.44, 0.84], [0.46, 1.0],
  ];
  const N = BEATS.length;
  const HOLD = Object.fromEntries(BEATS.map((b, i) => [i, b[2]]).filter(([, ms]) => ms));

  const setFrame = (i, bg) => {
    const [y, squash] = BEATS[i];
    parts.star.position.set(0, y, 0);
    parts.star.scale.set(1 / Math.sqrt(squash), squash, 1);
    parts.star.rotation.y = 0.35 * Math.sin(i / N * Math.PI * 2);
    ground.material.color.setHex(SHADOW[bg] ?? SHADOW.dark);
    renderer.setClearColor(BG[bg] ?? 0xffffff, bg === 'clear' ? 0 : 1);
    renderer.render(scene, camera);
    if (!exporting) {
      view.clearRect(0, 0, 200, 200);
      view.drawImage(glCanvas, 0, 0, 200, 200);
    }
  };

  if (exporting) {
    document.body.replaceChildren(glCanvas);
    document.body.style.cssText = 'margin:0;padding:0;background:transparent';
    glCanvas.style.cssText = `width:${PX}px;height:${PX}px;display:block`;
    setFrame(Number(query.get('frame')) % N, query.get('bg') || 'white');
    return;
  }

  const playBtn = document.getElementById('play');
  const frameEl = document.getElementById('frame');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, frame = 0, acc = 0, last = null;
  const show = () => { setFrame(frame, stage.dataset.bg); frameEl.textContent = `frame ${frame + 1}/${N}`; };
  const setPlaying = v => {
    playing = v; last = null; acc = 0;
    playBtn.textContent = v ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-pressed', String(v));
  };
  const tick = now => {
    if (playing) {
      if (last !== null) acc += now - last;
      last = now;
      const wait = HOLD[frame] || FRAME_MS;
      if (acc >= wait) { acc -= wait; frame = (frame + 1) % N; show(); }
    }
    requestAnimationFrame(tick);
  };
  const step = d => { setPlaying(false); frame = (frame + d + N) % N; show(); };
  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.querySelectorAll('button[data-bg]').forEach(b => b.addEventListener('click', () => {
    stage.dataset.bg = b.dataset.bg;
    document.querySelectorAll('button[data-bg]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    show();
  }));
  setPlaying(playing);
  show();
  requestAnimationFrame(tick);
})();
</script>
